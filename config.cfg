# Target ID range (inclusive)
start = 232400
end = 233400

# Paths
output = ./downloads
db = ./pixiv_state.db

# Pixiv PHPSESSID cookie (optional, required for R-18 works and higher rate limits)
session = YOUR_PHPSESSID_HERE

# Concurrency and rate limiting
# Pixiv rate limits single IPs to ~2-4 requests/second.
# Recommended for direct connection (no proxy): threads = 3, delay = 600
# If using a proxy list with multiple IPs: threads = 8..16, delay = 200..300
threads = 3
delay = 600

# AI-generated artwork filter (true = download AI works, false = skip AI works)
ai = true

# Proxy configuration (optional)
# Supports http://, https://, socks5://, socks5h://
# You can also specify 'noproxy' / 'direct' to route directly without proxy
# proxy = socks5h://127.0.0.1:1080
# proxy-file = ./proxies.txt
